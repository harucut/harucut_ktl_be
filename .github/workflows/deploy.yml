# 운영(prod) 자동 배포 파이프라인.
# main 브랜치에 push(=PR merge)되면: 테스트 → 이미지 빌드 → GHCR push → EC2 배포.
name: Deploy to Production

on:
  push:
    branches: [main]

# 동시에 여러 배포가 겹치지 않게 직렬화. (앞 배포가 끝날 때까지 대기, 취소는 안 함)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ── 1) 테스트 게이트 + 이미지 빌드 + GHCR push ───────────────────────
  build-and-push:
    name: Test · Build · Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read      # 소스 체크아웃
      packages: write     # GHCR 에 이미지 push (GITHUB_TOKEN 으로 인증)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle     # gradle 의존성 캐시 → 빌드 시간 단축

      # 테스트 실패 시 여기서 파이프라인 중단 → 깨진 이미지가 배포되지 않음(핵심 안전장치).
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 이 자동 발급 — 별도 Secret 불필요

      # 이미지 두 태그로 push: 커밋 SHA(불변, 롤백용) + latest(가독용).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  # ── 2) EC2 에 SSH 접속 → 새 이미지 pull & 재기동 ─────────────────────
  deploy:
    name: Deploy to EC2 (prod)
    needs: build-and-push        # 1) 이 성공해야 실행
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read             # EC2 가 private 이미지 pull 할 때 쓸 토큰 권한
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 아래 env 값들을 원격 셸로 전달
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,APP_DIR
          script: |
            set -euo pipefail
            # private GHCR 이미지 pull 위해 로그인 (이 실행에서만 유효한 토큰)
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            cd "${APP_DIR}"
            # 루트 .env 의 IMAGE_TAG 를 방금 빌드한 커밋 SHA 로 갱신 (없으면 추가)
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              printf '\nIMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env
            fi

            docker compose pull app        # 새 이미지 내려받기
            docker compose up -d            # 변경분만 무중단에 가깝게 재기동
            docker image prune -f           # 이전 dangling 이미지 정리
            docker logout ghcr.io
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # EC2 에서 repo(=compose 파일들)가 위치한 절대경로. ★ 본인 환경에 맞게 확인 필요 ★
          APP_DIR: /home/ubuntu/harucut_ktl_be
