# 프로젝트명 고정 (compose 파일이 deploy/ 하위라 기본값이 폴더명 'deploy'가 되는 것을 방지)
name: harucut_be

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  redis_data: